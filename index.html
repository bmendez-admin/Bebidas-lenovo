<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostico 4</title>
    <style>
      :root {
        --red-signature: #E1251B;
        --purple-deep-2: #7A126B;
        --white: #FFFFFF;
        --black: #1E0013;
        --font-brand: 'Montserrat', 'Lato', Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: var(--font-brand);
        background: var(--black);
        color: var(--white);
      }
      #app {
        position: relative;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 65px 115px;
      }
      .bg-gradient-deep {
        background:
          repeating-linear-gradient(96deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 10px),
          radial-gradient(circle at 88% 10%, rgba(216, 27, 130, 0.55), transparent 42%),
          radial-gradient(circle at 6% 92%, rgba(225, 37, 27, 0.5), transparent 48%),
          linear-gradient(165deg, #2b0a1b 0%, #3d0f2c 35%, #260a22 70%, #1a0616 100%);
      }
      .brand-title {
        font-weight: 300;
        font-size: 58px;
        margin-bottom: 27px;
      }
      .brand-title strong { font-weight: 800; }
      .cta-button {
        font-family: var(--font-brand);
        font-weight: 700;
        font-size: 24px;
        color: var(--white);
        background: linear-gradient(90deg, var(--red-signature) 0%, var(--purple-deep-2) 100%);
        border: none;
        border-radius: 999px;
        padding: 16px 42px;
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="screen bg-gradient-deep">
      <h1 class="brand-title">PRUEBA 4<br /><strong>SIN FUENTES, SIN JS, SIN IMAGENES</strong></h1>
      <button class="cta-button" id="btn-start">Comenzar</button>
    </div></div>
  </body>
</html>
