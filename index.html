<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostico ADMIRA 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    #app {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: purple;
      color: white;
      font-family: sans-serif;
      font-size: 40px;
      font-weight: bold;
      border: 20px solid lime;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Simula exactamente el patrón real del kiosko:
    // body vacío al cargar, JS llena #app después con un pequeño delay
    setTimeout(function () {
      document.getElementById('app').innerHTML =
        '<div class="screen">PRUEBA 3: BODY VACÍO<br>LLENADO POR JS<br>(IGUAL QUE EL KIOSKO REAL)</div>';
    }, 200);
  </script>
</body>
</html>
