<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenovo LAB — Estado de tu pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="css/estado.css" />
</head>
<body class="bg-gradient-deep estado-body">
  <div class="estado-header">
    <h1 class="estado-title">Estado de tu <strong>fórmula</strong></h1>
  </div>

  <div class="estado-columns">
    <div class="estado-column">
      <div class="estado-column-header">
        <svg class="estado-column-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c1 3-2 4-2 7a4 4 0 008 0c0-2-1-3-1-3s2 1 2 5a7 7 0 11-14 0c0-5 4-6 4-6s-1-2 3-3z"/></svg>
        <span class="estado-column-title">En preparación</span>
        <span class="estado-column-count" id="count-preparacion">0</span>
      </div>
      <div class="estado-cards" id="cards-preparacion">
        <div class="estado-empty">
          <svg class="estado-empty-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h14l-2 12H7L5 3z"/><path d="M9 15v4a1 1 0 001 1h4a1 1 0 001-1v-4"/></svg>
          <p class="estado-empty-text">Cargando...</p>
        </div>
      </div>
    </div>

    <div class="estado-column">
      <div class="estado-column-header">
        <svg class="estado-column-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="estado-column-title">Listos para recoger</span>
        <span class="estado-column-count" id="count-listo">0</span>
      </div>
      <div class="estado-cards" id="cards-listo">
        <div class="estado-empty">
          <svg class="estado-empty-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h14l-2 12H7L5 3z"/><path d="M9 15v4a1 1 0 001 1h4a1 1 0 001-1v-4"/></svg>
          <p class="estado-empty-text">Aquí aparecerán tus bebidas listas</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/estado.js"></script>
</body>
</html>
